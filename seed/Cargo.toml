[package]
name = "tachyon"
version = "0.0.0"
edition = "2024"

[dependencies]
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
clap = { version = "4.5.59", features = ["derive"] }
tracing = "0.1.44"
cranelift-codegen = { version = "0.136.2", features = ["x86", "arm64"] }
cranelift-frontend = "0.136.2"
cranelift-module = "0.136.2"
cranelift-object = "0.136.2"
cranelift-native = "0.136.2"
target-lexicon = "0.13.5"

[dev-dependencies]
insta = { version = "1.49.0", features = ["glob"] }
