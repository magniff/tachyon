# The release chain: from nothing but a Rust toolchain and clang to the
# tachyon compiler at HEAD. See docs/releases.md for the process and the
# rules; bootstrap/bootstrap.sh follows this file.
#
# stage0 is the Rust implementation of tachyon, frozen in the tree of
# v1.0.0 (under stage0/). It builds release 1.0.0, whose compiler is
# written in tachyon; every later release is built by the release before
# it, and HEAD by the last release. Every step is checked: the new
# compiler's own test suite must pass, and it must reach the fixpoint
# (compiled by itself, it emits exactly what it emitted when compiled by
# its builder's output).
#
# Format: a small subset of TOML. One [[release]] table per release, in
# order, then [head]. Values are strings; `hosts` is a list of strings.
#
#   version   the release (semver)
#   tag       the git tag of the release; its tree is self-contained
#   compiler  the directory of the compiler's .tach files, compiled together
#   built_by  "stage0" (the stage0/ directory of the release's own tree) or
#             the version of the previous release
#   cli       how the release's binary is invoked:
#               tachyonc-v1  `tachyonc <files> -o out.s`, AArch64 macOS
#                            assembly, assembled and linked with clang
#   tests     the release's test runner, run as `<tests> -c <compiler>`
#   hosts     where the release runs (`uname -s`-`uname -m`, lowercase)
#   summary   what the release introduced

[[release]]
version = "1.0.0"
tag = "v1.0.0"
compiler = "compiler/src"
built_by = "stage0"
cli = "tachyonc-v1"
tests = "tests/run.sh"
hosts = ["darwin-arm64"]
summary = "The first self-hosted compiler: the whole stage0 language, compiled to AArch64 assembly for macOS."

# HEAD (or the working tree), built by the last release.
[head]
compiler = "compiler/src"
cli = "tachyonc-v1"
tests = "tests/run.sh"
hosts = ["darwin-arm64"]
