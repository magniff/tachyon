# The release chain: from nothing but git, a Rust toolchain and a C
# compiler to the tachyon compiler at HEAD. See docs/releases.md for the
# process and the rules; bootstrap/bootstrap.sh follows this file.
#
# The seed is the Rust implementation of tachyon, frozen at the `seed` tag
# (under seed/). It builds release 0.1.0, whose compiler is written in
# tachyon; every later release is built by the release before it, and HEAD
# by the last release. Every step is checked: the new compiler's own test
# suite must pass, and it must reach the fixpoint (compiled by itself, it
# emits exactly what it emitted when compiled by its builder's output).
#
# Format: a small subset of TOML. A [seed] table, one [[release]] table per
# release, oldest first, then [head]. bootstrap.sh checks that the versions
# increase, compared as numbers (0.9.0 < 0.10.0); other scripts take the
# releases in this order (bootstrap/release-tags.sh), never sorting
# versions or tags as text. Values are strings; `hosts` is a list of
# strings.
#
# [seed]
#   tag       the git tag holding the frozen seed
#   dir       its directory in that tree (a cargo project)
#
# [[release]]
#   version   the release (semver)
#   tag       the git tag of the release; its tree is self-contained
#   compiler  the directory of the compiler's source
#   root      (from 0.6) the root file of the compiler's module tree, in
#             `compiler`; without it, all the .tach files of `compiler` are
#             compiled together, as one module
#   built_by  "seed" or the version of the previous release
#   cli       how the release's binary is invoked:
#               tachyonc-0.1  `tachyonc --target <host> <files> -o out.s`
#                             (<files>: the root file, or all of them),
#                             assembly assembled and linked by cc
#               tachyonc-0.7  `tachyonc --target <host> <files> -o out.o`,
#                             the object written by the compiler, linked by
#                             cc; the fixpoint compares the objects
#               tachyonc-0.9  the same with `--allow-unsafe`: no warnings
#                             for the compiler's own unsafe operations
#                             outside unsafe code (until 0.10 migrates it)
#               tachyonc-0.10 as tachyonc-0.7: the compiler's source is
#                             in unsafe code, and 0.10 has no
#                             `--allow-unsafe` (unsafe operations outside
#                             unsafe code are errors)
#   tests     the release's test runner, run as
#             `<tests> -c <compiler> -t <host>` from the release's tree
#   hosts     the hosts it builds and runs on (tachyon target names);
#             from 0.11 also aarch64-linux, which no release before 0.11
#             (nor the seed) runs on: the chain runs on another host and
#             cross-builds the compiler for it (bootstrap.sh --host
#             aarch64-linux, then bootstrap/aarch64-linux-check.sh)
#   summary   what the release introduced

[seed]
tag = "seed"
dir = "seed"

[[release]]
version = "0.1.0"
tag = "v0.1.0"
compiler = "compiler/src"
built_by = "seed"
cli = "tachyonc-0.1"
tests = "tests/run.sh"
hosts = ["aarch64-macos", "x86_64-linux", "x86_64-macos"]
summary = "The first self-hosted compiler: the seed's whole language, compiled to AArch64 (macOS) and x86-64 (Linux, macOS) assembly."

[[release]]
version = "0.2.0"
tag = "v0.2.0"
compiler = "compiler/src"
built_by = "0.1.0"
cli = "tachyonc-0.1"
tests = "tests/run.sh"
hosts = ["aarch64-macos", "x86_64-linux", "x86_64-macos"]
summary = "The optimizer: an SSA IR (Braun et al.), SCCP, instruction combining, GVN, LICM, inlining and linear-scan register allocation (-O0/-O1/-O2, default -O2)."

[[release]]
version = "0.3.0"
tag = "v0.3.0"
compiler = "compiler/src"
built_by = "0.2.0"
cli = "tachyonc-0.1"
tests = "tests/run.sh"
hosts = ["aarch64-macos", "x86_64-linux", "x86_64-macos"]
summary = "Aggregates and memory: enums and match, methods, slices; extern \"C\" and #[repr(C)] with C's calling convention for aggregates; SROA, memory forwarding and dead stores across blocks, switches and jump tables."

[[release]]
version = "0.4.0"
tag = "v0.4.0"
compiler = "compiler/src"
built_by = "0.3.0"
cli = "tachyonc-0.1"
tests = "tests/run.sh"
hosts = ["aarch64-macos", "x86_64-linux", "x86_64-macos"]
summary = "Loops and C headers: the compiler written in the 0.3 language; import of C headers and --emit-header; use, checked enum casts, size_of, for over slices; loop canonicalization, induction variables, rotation, unrolling, unswitching, strength reduction, value ranges and bounds-check elimination, aggressive DCE, tail recursion elimination."

[[release]]
version = "0.5.0"
tag = "v0.5.0"
compiler = "compiler/src"
built_by = "0.4.0"
cli = "tachyonc-0.1"
tests = "tests/run.sh"
hosts = ["aarch64-macos", "x86_64-linux", "x86_64-macos"]
summary = "Generics, modules and a back end of its own: generics by monomorphization, modules, several errors per compilation, a small std; linear scan with interval splitting, a tachyon calling convention, realigned frames, instruction selection by rules, block layout, selects, leaf frames and sibling calls."

[[release]]
version = "0.6.0"
tag = "v0.6.0"
compiler = "compiler/src"
root = "main.tach"
built_by = "0.5.0"
cli = "tachyonc-0.1"
tests = "tests/run.sh"
hosts = ["aarch64-macos", "x86_64-linux", "x86_64-macos"]
summary = "Interprocedural: the compiler as a module tree; string slices, if let, defer, structural ==, a prelude; a cost-model inliner, attribute inference, interprocedural constants, scalar promotion, heap to stack; shrink-wrapping."

[[release]]
version = "0.7.0"
tag = "v0.7.0"
compiler = "compiler/src"
root = "main.tach"
built_by = "0.6.0"
cli = "tachyonc-0.7"
tests = "tests/run.sh"
hosts = ["aarch64-macos", "x86_64-linux", "x86_64-macos"]
summary = "Object files: an assembler in the compiler writing Mach-O and ELF objects (cc only links; the self-build 4.4x faster at -O2, 15.7x at -O0); fixed-array indexing checked; undefined behaviour documented."

[[release]]
version = "0.8.0"
tag = "v0.8.0"
compiler = "compiler/src"
root = "main.tach"
built_by = "0.7.0"
cli = "tachyonc-0.7"
tests = "tests/run.sh"
hosts = ["aarch64-macos", "x86_64-linux", "x86_64-macos"]
summary = "No wildcard imports: `use x::*` and plain header imports are removed; every name is declared, imported by name or written with its path; tachyonc --fix-imports rewrites older code."

[[release]]
version = "0.9.0"
tag = "v0.9.0"
compiler = "compiler/src"
root = "main.tach"
built_by = "0.8.0"
cli = "tachyonc-0.9"
tests = "tests/run.sh"
hosts = ["aarch64-macos", "x86_64-linux", "x86_64-macos"]
summary = "unsafe, traits and an e-graph: unsafe blocks and functions (safe code has no undefined behaviour; warnings in 0.9, errors from 0.10); traits with bounds and operator traits, std HashMap and sort; GVN on an acyclic e-graph with checked rewrite rules."

[[release]]
version = "0.10.0"
tag = "v0.10.0"
compiler = "compiler/src"
root = "main.tach"
built_by = "0.9.0"
cli = "tachyonc-0.10"
tests = "tests/run.sh"
hosts = ["aarch64-macos", "x86_64-linux", "x86_64-macos"]
summary = "Vectors and profiles: unsafe operations outside unsafe are errors; vector types on NEON and SSE2; a loop vectorizer (inner and outer loops, reductions, run-time guards); profile-guided optimization; --check-unsafe; every error of a compilation reported."

[[release]]
version = "0.11.0"
tag = "v0.11.0"
compiler = "compiler/src"
root = "main.tach"
built_by = "0.10.0"
cli = "tachyonc-0.10"
tests = "tests/run.sh"
# (aarch64-linux: the chain runs on another host and cross-builds the
# compiler for it; docs/releases.md, "aarch64-linux")
hosts = ["aarch64-macos", "x86_64-linux", "x86_64-macos", "aarch64-linux"]
summary = "Feature-complete, and tools for agents: DWARF line tables (-g); aarch64-linux as a target and a host (cross-built); a broader bench/, a cost model for the loop vectorizer, unrolling with run-time trip counts, an SLP vectorizer, division by constants, ranges through phis; tachyonc query, check, fix, lint, same-output, edit by name and semantic refactorings (rename, move, signature, field, variant, rewrite, split, scripts, undo)."

[[release]]
version = "0.12.0"
tag = "v0.12.0"
compiler = "compiler/src"
root = "main.tach"
built_by = "0.11.0"
cli = "tachyonc-0.10"
tests = "tests/run.sh"
hosts = ["aarch64-macos", "x86_64-linux", "x86_64-macos", "aarch64-linux"]
summary = "The compiler's source reorganized through its own tools: folders by phase, no file over 1,000 lines, no re-exports, tidy imports (output identical to 0.11's); fix --only reexports and tidy-imports, split --reexport with part headers, edits of a module's use lines and header; a parallel release gate (bootstrap/gate.sh)."

[[release]]
version = "0.13.0"
tag = "v0.13.0"
compiler = "compiler/src"
root = "main.tach"
built_by = "0.12.0"
cli = "tachyonc-0.10"
tests = "tests/run.sh"
hosts = ["aarch64-macos", "x86_64-linux", "x86_64-macos", "aarch64-linux"]
summary = "The tools, improved from 0.12's record: partial-line edit patch, --pairs, edit wrap and new-file, signature --default, fix --in subtrees; section banners, query grep, query type, kinds of references; an on-disk cache for queries, check and edits; split part names, layout kept, refactor extract-function and inline; tachyonc fmt (the tree formatted), explain and guide."

[[release]]
version = "0.14.0"
tag = "v0.14.0"
compiler = "compiler/src"
root = "main.tach"
built_by = "0.13.0"
cli = "tachyonc-0.10"
tests = "tests/run.sh"
hosts = ["aarch64-macos", "x86_64-linux", "x86_64-macos", "aarch64-linux"]
summary = "Closures (captures, Fn bounds, escape checks), associated types, and iterators on them: for over iterators, std's sources and adapters, consumers on fold, chains optimized to the hand-written loop; std reads stdin, text helpers, in-place updates, an introsort; newcomer diagnostics (did you mean, std names, Rust habits); the tools on a user's program; the agent-eval suite and runner with the 0.13 baseline."

[[release]]
version = "0.15.0"
tag = "v0.15.0"
compiler = "compiler/src"
root = "main.tach"
built_by = "0.14.0"
cli = "tachyonc-0.10"
tests = "tests/run.sh"
hosts = ["aarch64-macos", "x86_64-linux", "x86_64-macos", "aarch64-linux"]
summary = "Errors, conversions and less boilerplate: `?` on Option and Result, generic traits, From/Into, main returning Result, std's I/O on Result with typed errors; lossless integer widening and joins, i64::MAX; f-strings over Display and Debug, generic print and format; #[derive(Eq, Ord, Hash, Debug, Clone)], Clone; named and default arguments, field shorthand; == on Vec, Buf and HashMap by contents; std loaded by sections; the tools for agents (query context and budgets, std from any program, try, batch, edit apply and several targets, merge conflicts, --json, the check hook); back, gen0 and base on closures and iterators; six harder eval tasks."

[[release]]
version = "0.16.0"
tag = "v0.16.0"
compiler = "compiler/src"
root = "main.tach"
built_by = "0.15.0"
cli = "tachyonc-0.10"
tests = "tests/run.sh"
hosts = ["aarch64-macos", "x86_64-linux", "x86_64-macos", "aarch64-linux"]
summary = "Effects and explicit allocation: inferred effect sets (alloc(A), io, global, panic, diverge, unsafe), #[pure]/#[no_*]/#[effects] declarations and effects(...) bounds checked transitively, query effects --why, --verify-effects; allocation explicit (fn main(gpa: Gpa), *_in constructors, fix --only alloc016), the Allocator trait, Gpa, arenas and scoped arenas, FixedBuf, a non-allocating Fmt; #[sealed] std types, #[scoped] arenas; --check-alloc (use after free, double free, leaks, arenas' resets and scopes); calls the effects make pure numbered and hoisted, arena allocation without calls; link inputs on the command line; the compiler's source on 0.15's features; compiler eval tasks."

[[release]]
version = "0.17.0"
tag = "v0.17.0"
compiler = "compiler/src"
root = "main.tach"
built_by = "0.16.0"
cli = "tachyonc-0.10"
tests = "tests/run.sh"
hosts = ["aarch64-macos", "x86_64-linux", "x86_64-macos", "aarch64-linux"]
summary = "Memory safety by mutable value semantics: owned values move and are dropped at the end of their scope (Drop, drop glue, .clone() explicit), references &T and &mut T second-class, slices split into read-only [T] and exclusive &mut [T], views checked for exclusivity with inferred view summaries (#[views] pins), --values=error the default (warn, report, off); noalias and read-only facts from references, NRVO and copy-to-move elision; std on values; fix --values and the corpus migrated; query own, query views, explain own.*, the own-try tests; familiar forms (&mut x, v[i] and p.0 through pointers, len(), panic/unreachable, sibling use paths, module paths in code), the &f diagnostic, fix --suggested, --trace, probe and reduce; compile speed (per-function IR, -O1 inlining of small leaves, f-strings written in place)."

[[release]]
version = "0.18.0"
tag = "v0.18.0"
compiler = "compiler/src"
root = "main.tach"
built_by = "0.17.0"
cli = "tachyonc-0.10"
tests = "tests/run.sh"
hosts = ["aarch64-macos", "x86_64-linux", "x86_64-macos", "aarch64-linux"]
summary = "Contracts and verification in the language: requires/ensures with result and old(..), checked at run time with the caller blamed, std's own clauses, assert/assert_eq/assert_ne/debug_assert; one failure line with position, condition and values for every run-time check; query checks (what the optimizer proved, what is left); #[test], #[cfg(test)], snapshots, #[property] with generated and shrunk inputs, #[fuzz] with coverage, tachyonc test comparing -O0 and -O2, tachyonc fuzz, reduce over programs; type X = distinct T, std::NonNull with the null niche and a checked cast; std's Display, Debug, Iterator and Clone on references, fix --values for traits; the eval's +debrief."

[[release]]
version = "0.18.1"
tag = "v0.18.1"
compiler = "compiler/src"
root = "main.tach"
built_by = "0.18.0"
cli = "tachyonc-0.10"
tests = "tests/run.sh"
hosts = ["aarch64-macos", "x86_64-linux", "x86_64-macos", "aarch64-linux"]
summary = "Two use-after-free fixes in safe code (a changed copy of a borrowed element, a reference into a Vec across a push); functions compiled in parallel (-j N, byte-identical at any -j) and incremental rebuilds from a code cache; every *T raw (V4), the compiler and std on references; contracts' evidence in generated code, range fixes and entry facts; BinaryHeap and MinHeap, Rust's binding modes on references, let-else, the agent-efficiency polish of the 0.18 eval; a valgrind row in the gate and a lock on the bootstrap cache."

[[release]]
version = "0.19.0"
tag = "v0.19.0"
compiler = "compiler/src"
root = "main.tach"
built_by = "0.18.1"
cli = "tachyonc-0.10"
tests = "tests/run.sh"
hosts = ["aarch64-macos", "x86_64-linux", "x86_64-macos", "aarch64-linux"]
summary = "CPU intrinsics and target features: std::arch with over 1,775 AArch64 intrinsics (NEON, crc, sha2, sha512, sha3, aes, pmull, dotprod, float), each checked lane by lane against a scalar reference, and 484 x86_64 intrinsics (SSE to AVX2, FMA, BMI, AES-NI, SHA, PCLMUL) encoded as cc does, compile-tested only; target features inferred like effects, has/detect guards, -C target-cpu/target-feature, run-time detection and #[multiversion]; intrinsics pure to the optimizer, vectors passed in vector registers; query arch, guide arch, examples/arch, the fuzzer's arch mode, tachyonc assemble."

[[release]]
version = "0.19.1"
tag = "v0.19.1"
compiler = "compiler/src"
root = "main.tach"
built_by = "0.19.0"
cli = "tachyonc-0.10"
tests = "tests/run.sh"
hosts = ["aarch64-macos", "x86_64-linux", "x86_64-macos", "aarch64-linux"]
summary = "Two soundness fixes: the store intrinsics take a writable &mut [T] destination, and the 0.17 transitional rule that accepted a read-only [T] where &mut [T] is wanted is gone (fix --values migrates); examples/arch/sha256sum, coreutils-compatible and faster than the system's on the SHA-256 instructions."

# HEAD (or the working tree), built by the last release.
[head]
compiler = "compiler/src"
root = "main.tach"
cli = "tachyonc-0.10"
tests = "tests/run.sh"
hosts = ["aarch64-macos", "x86_64-linux", "x86_64-macos", "aarch64-linux"]
