# The gate's defaults for this repository (read by bootstrap/gate.sh;
# $VOLE_GATE_X86 and the command line override them).
#
# X86: 1 to test x86_64 too (the x86_64-linux container: its own chain,
# the suite, fuzz, ABI, objcheck, layouts), 0 not to. Off since 0.15
# (2026-10-15): the emulated x86_64 container costs about half of the
# release gate's machine time, and the work is on the language and the
# evals; `gate.sh --with-x86` runs it for one gate.
X86=0
