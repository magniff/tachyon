[package]
name = "voltty-oracle"
version = "0.1.0"
edition = "2021"
publish = false
description = "The reference terminal for examples/voltty/core: alacritty_terminal's state as a dump"

# alacritty_terminal 0.26.0 is the crate Alacritty 0.17.0 (94e7c88) is built
# on: the oracle's behaviour is the installed Alacritty's.
[dependencies]
alacritty_terminal = { version = "=0.26.0", default-features = false }
unicode-width = "=0.2.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false

[workspace]
