# bench/std's Rust halves that need crates (0.20): unicode-segmentation and
# unicode-width, offline from ~/.cargo; bench/std/run.sh builds a NAME.rs
# whose first line is `// cargo: ...` here, as the bin NAME.
[package]
name = "unicode-rs-bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"

[[bin]]
name = "graphemes"
path = "../graphemes.rs"

[[bin]]
name = "width"
path = "../width.rs"

[[bin]]
name = "term_feed"
path = "../term_feed.rs"

[profile.release]
opt-level = 3
codegen-units = 1
panic = "abort"
