# The naga baseline of bench/gpu/shader/run.sh: naga 29.0.4, wgsl-in and
# msl-out, built offline from the cargo registry when it is there.
[package]
name = "nagabench"
version = "0.1.0"
edition = "2021"

[dependencies]
naga = { version = "=29.0.4", features = ["wgsl-in", "msl-out"] }

[profile.release]
opt-level = 3
