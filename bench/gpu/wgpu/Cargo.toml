# The wgpu side of bench/gpu (docs/design/gpu.md §5): the same draw
# encoding as draws.vl and draws.m. Built offline from ~/.cargo's cache:
#   cargo build --release --offline --manifest-path bench/gpu/wgpu/Cargo.toml
[package]
name = "wgpu-draws"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["metal", "wgsl"] }
pollster = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace]
