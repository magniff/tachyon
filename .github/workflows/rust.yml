name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install nasm
      run: sudo apt-get update && sudo apt-get install -y nasm
    - name: Build
      run: cargo build --verbose
    - name: Unit and snapshot tests
      run: cargo test --verbose --lib --test asm_snapshots
    - name: Golden programs (assemble, link, run)
      env:
        TACHYON_REQUIRE_RUN: "1"
      run: cargo test --verbose --test run -- --nocapture
    - name: Clippy
      run: cargo clippy --all-targets
