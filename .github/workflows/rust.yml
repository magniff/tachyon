name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

# The seed, the Rust implementation, lives in seed/.
defaults:
  run:
    working-directory: seed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Unit and snapshot tests
      run: cargo test --verbose --lib --test clif_snapshots --test cranelift
    - name: Golden programs (compile, link, run)
      env:
        TACHYON_REQUIRE_RUN: "1"
      run: cargo test --verbose --test run -- --nocapture
    - name: Clippy
      run: cargo clippy --all-targets
